services:

  api1:
    build:
      context: ./Api
    container_name: api-3000
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    depends_on:
      - postgres
    networks:
      - red-app


  api2:
    build:
      context: ./Api
    container_name: api-3001
    restart: always
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
    depends_on:
      - postgres
    networks:
      - red-app


  api3:
    build:
      context: ./Api
    container_name: api-3002
    restart: always
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
    depends_on:
      - postgres
    networks:
      - red-app



  postgres:

    image: postgres:16

    container_name: base-datos-postgres

    restart: always

    environment:

      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}


    ports:

      - "5432:5432"


    volumes:

      - postgres_data:/var/lib/postgresql/data


    networks:

      - red-app



volumes:

  postgres_data:



networks:

  red-app:

    driver: bridge